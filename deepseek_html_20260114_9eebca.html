<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Диагностика вовлеченности ученика</title>
  <style>
    body {
      background-color: #121212;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      margin: 20px auto;
      max-width: 900px;
      line-height: 1.8;
      font-size: 20px;
    }
    h1 {
      text-align: center;
      font-size: 28px;
    }
    .center {
      text-align: center;
    }
    .card {
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    .question label {
      display: block;
      margin-bottom: 10px;
    }
    select {
      background-color: #1e1e1e;
      color: #f0f0f0;
      border: 1px solid #444;
      font-size: 18px;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
    }
    button {
      background-color: #2196f3;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
    }
    .result {
      background-color: #2a2a2a;
      border: 2px solid #2196f3;
      border-radius: 12px;
      font-size: 20px;
      padding: 20px;
      margin-top: 30px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
    }
    .result.visible {
      opacity: 1;
    }
    .channel-link {
      color: #90caf9;
      text-decoration: none;
      font-size: 20px;
      margin: 20px 0;
      display: block;
    }
    .channel-link:hover {
      text-decoration: underline;
    }
    .author {
      color: #90caf9;
      text-decoration: none;
      font-size: 18px;
      margin-top: 40px;
      display: block;
    }
    .author:hover {
      text-decoration: underline;
    }
    @media (max-width: 600px) {
      body {
        padding: 10px;
        font-size: 20px;
      }
      h1 {
        font-size: 24px;
      }
      select {
        font-size: 18px;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>Диагностика вовлеченности ученика</h1>
  
  <div class="center">
    <a href="https://t.me/educatorslab" target="_blank" class="channel-link">
      📢 Канал для педагогов "Oh captain, my captain"
    </a>
  </div>

  <form id="engagementForm">

    <!-- Когнитивная вовлечённость (первые 5 вопросов) -->
    <div class="question card">
      <label>1. Как ученик реагирует на задания, особенно творческие или игровые?</label>
      <select name="cognitive">
        <option value="3">🔲 С энтузиазмом, проявляет инициативу, хочет продолжать</option>
        <option value="2">🔲 Реагирует нейтрально, делает, что просят, но без особого интереса</option>
        <option value="1">🔲 Делает нехотя, без эмоций</option>
        <option value="0">🔲 Сопротивляется, отказывается или просит "пропустить"</option>
      </select>
    </div>

    <div class="question card">
      <label>2. Насколько активно ученик участвует в говорении на уроке (спонтанная речь, диалог, ответ)?</label>
      <select name="cognitive">
        <option value="3">🔲 Говорит охотно, пытается строить фразы, проявляет инициативу</option>
        <option value="2">🔲 Отвечает на вопросы, но без желания развить мысль</option>
        <option value="1">🔲 Отвечает минимально, односложно, избегает речи</option>
        <option value="0">🔲 Почти не говорит, требуется постоянное подталкивание</option>
      </select>
    </div>

    <div class="question card">
      <label>3. Проявляет ли ученик любопытство к новым темам или вопросам?</label>
      <select name="cognitive">
        <option value="3">🔲 Часто задаёт вопросы, хочет глубже понять тему</option>
        <option value="2">🔲 Интерес проявляется только в знакомых темах</option>
        <option value="1">🔲 Редко проявляет интерес, отвечает только по необходимости</option>
        <option value="0">🔲 Полностью безучастен к новому материалу</option>
      </select>
    </div>

    <div class="question card">
      <label>4. Как ученик работает с обратной связью и ошибками?</label>
      <select name="cognitive">
        <option value="3">🔲 Активно анализирует ошибки, задаёт уточняющие вопросы</option>
        <option value="2">🔲 Принимает исправления, но не углубляется</option>
        <option value="1">🔲 Игнорирует или быстро забывает комментарии</option>
        <option value="0">🔲 Не воспринимает критику, отрицает ошибки</option>
      </select>
    </div>

    <div class="question card">
      <label>5. Использует ли ученик ранее изученный материал в новой ситуации?</label>
      <select name="cognitive">
        <option value="3">🔲 Да, часто и успешно применяет знания в новом контексте</option>
        <option value="2">🔲 Иногда пробует, но не всегда уверенно</option>
        <option value="1">🔲 Редко, только если напомнить</option>
        <option value="0">🔲 Не применяет, даже если ситуация аналогична</option>
      </select>
    </div>

    <!-- Эмоциональная вовлечённость (следующие 5 вопросов) -->
    <div class="question card">
      <label>6. Какую эмоциональную реакцию вызывает у ученика сам факт начала занятия?</label>
      <select name="emotional">
        <option value="3">🔲 Радость, предвкушение, приходит с улыбкой или вовлечённой энергией</option>
        <option value="2">🔲 Спокойное принятие, без особого настроя</option>
        <option value="1">🔲 Отстранённость, лёгкое недовольство ("опять урок...")</option>
        <option value="0">🔲 Сопротивление, уныние, просьбы пропустить, жалобы</option>
      </select>
    </div>

    <div class="question card">
      <label>7. Какие эмоции проявляются во время выполнения заданий?</label>
      <select name="emotional">
        <option value="3">🔲 Увлечённость, азарт, удовольствие от самого процесса</option>
        <option value="2">🔲 Нейтральность, ровное состояние</option>
        <option value="1">🔲 Скука, апатия, безразличие</option>
        <option value="0">🔲 Раздражение, фрустрация, подавленность</option>
      </select>
    </div>

    <div class="question card">
      <label>8. Как ученик эмоционально реагирует на успехи?</label>
      <select name="emotional">
        <option value="3">🔲 Радуется, гордится, делится эмоцией</option>
        <option value="2">🔲 Отмечает сдержанно, но явно доволен</option>
        <option value="1">🔲 Почти не выражает никаких эмоций</option>
        <option value="0">🔲 Реагирует недоверием, занижает значимость</option>
      </select>
    </div>

    <div class="question card">
      <label>9. Проявляет ли ученик удовольствие от общения с преподавателем?</label>
      <select name="emotional">
        <option value="3">🔲 Да, устанавливает тёплый эмоциональный контакт, улыбается, шутит</option>
        <option value="2">🔲 Общается корректно, но эмоционально сдержан</option>
        <option value="1">🔲 Предпочитает молчание, избегает личного взаимодействия</option>
        <option value="0">🔲 Видимо раздражён или напряжён в присутствии преподавателя</option>
      </select>
    </div>

    <div class="question card">
      <label>10. Наблюдается ли эмоциональный подъём к концу занятия?</label>
      <select name="emotional">
        <option value="3">🔲 Да, ученик уходит воодушевлённым, с чувством успеха</option>
        <option value="2">🔲 Уходит спокойным, без видимой динамики</option>
        <option value="1">🔲 Уходит усталым, поникшим</option>
        <option value="0">🔲 Уходит с негативными комментариями или явным напряжением</option>
      </select>
    </div>

    <!-- Поведенческая вовлечённость (последние 5 вопросов) -->
    <div class="question card">
      <label>11. Как часто ученик приходит на урок без необходимых материалов?</label>
      <select name="behavioral">
        <option value="4">⬜ Никогда – он всегда подготовлен</option>
        <option value="3">⬜ Редко – может забыть что-то 1 раз в месяц</option>
        <option value="2">⬜ Иногда – забывает что-то примерно раз в 2 недели</option>
        <option value="1">⬜ Часто – практически каждую неделю чего-то не хватает</option>
        <option value="0">⬜ Почти всегда – не приносит материалы систематически</option>
      </select>
    </div>

    <div class="question card">
      <label>12. Как ученик реагирует на начало урока или переход к новым заданиям?</label>
      <select name="behavioral">
        <option value="4">⬜ Быстро включается в работу без напоминаний</option>
        <option value="3">⬜ Иногда отвлекается, но быстро возвращается</option>
        <option value="2">⬜ Обычно отвлекается, нужно напоминать несколько раз</option>
        <option value="1">⬜ Явно избегает начала работы, тянет время</option>
        <option value="0">⬜ Часто отказывается приступать, саботирует переход</option>
      </select>
    </div>

    <div class="question card">
      <label>13. Делает ли ученик домашнее задание, если оно выдается?</label>
      <select name="behavioral">
        <option value="4">⬜ Всегда и в срок</option>
        <option value="3">⬜ Почти всегда, может забыть один раз в месяц</option>
        <option value="2">⬜ Примерно в половине случаев</option>
        <option value="1">⬜ Редко выполняет, часто ссылается на занятость</option>
        <option value="0">⬜ Почти никогда, игнорирует эту часть обучения</option>
      </select>
    </div>

    <div class="question card">
      <label>14. Как ученик ведет себя во время повторяющихся рутинных заданий?</label>
      <select name="behavioral">
        <option value="4">⬜ Выполняет с интересом и вовлечённостью</option>
        <option value="3">⬜ Выполняет без энтузиазма, но стабильно</option>
        <option value="2">⬜ Часто отвлекается, требует подталкивания</option>
        <option value="1">⬜ Реагирует негативно, может пытаться избегать</option>
        <option value="0">⬜ Активно сопротивляется, саботирует или отказывается</option>
      </select>
    </div>

    <div class="question card">
      <label>15. Насколько ученик соблюдает структуру работы на уроке?</label>
      <select name="behavioral">
        <option value="4">⬜ Следует ритму и структуре без проблем</option>
        <option value="3">⬜ Иногда проседает в середине урока</option>
        <option value="2">⬜ Часто сбивается, требуется подгонять</option>
        <option value="1">⬜ Структура урока постоянно «рассыпается» из-за его поведения</option>
        <option value="0">⬜ Урок постоянно приходится перестраивать из-за несоблюдения рутин</option>
      </select>
    </div>

    <div class="center">
      <button type="button" onclick="calculateScores()">Показать результат</button>
    </div>
  </form>

  <div class="result" id="resultBox"></div>

  <div class="center">
    <a href="https://t.me/educatorslab" target="_blank" class="author">
      Автор теста: Сухих Ольга
    </a>
  </div>

  <script>
    function calculateScores() {
      const form = document.forms['engagementForm'];
      const resultBox = document.getElementById('resultBox');

      let cognitive = 0, emotional = 0, behavioral = 0;

      Array.from(form.elements).forEach(el => {
        if (el.name === "cognitive") cognitive += parseInt(el.value);
        if (el.name === "emotional") emotional += parseInt(el.value);
        if (el.name === "behavioral") behavioral += parseInt(el.value);
      });

      let cognitiveText = "";
      if (cognitive >= 12) cognitiveText = "Высокая когнитивная вовлечённость";
      else if (cognitive >= 8) cognitiveText = "Средняя когнитивная вовлечённость";
      else cognitiveText = "Низкая когнитивная вовлечённость";

      let emotionalText = "";
      if (emotional >= 12) emotionalText = "Эмоционально вовлечён и вдохновлён";
      else if (emotional >= 8) emotionalText = "Нейтральная эмоциональная вовлечённость";
      else emotionalText = "Эмоциональная отстранённость";

      let behavioralText = "";
      if (behavioral >= 16) behavioralText = "Стабильное ответственное поведение";
      else if (behavioral >= 10) behavioralText = "Поведение нестабильно, требует внимания";
      else behavioralText = "Низкая поведенческая вовлечённость";

      resultBox.classList.add('visible');
      resultBox.innerHTML = `
        <h3>Результаты:</h3>
        <p><strong>Когнитивная вовлечённость:</strong> ${cognitive} / 15</p>
        <p>${cognitiveText}</p>
        <p><strong>Эмоциональная вовлечённость:</strong> ${emotional} / 15</p>
        <p>${emotionalText}</p>
        <p><strong>Поведенческая вовлечённость:</strong> ${behavioral} / 20</p>
        <p>${behavioralText}</p>
      `;
    }
  </script>
</body>
</html>
